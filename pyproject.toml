[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blueforce-x"
version = "1.0.0"
description = "Isolated synthetic Bluetooth security research laboratory"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "textual>=0.58",
  "psutil>=5.9",
  "matplotlib>=3.8",
]

[project.scripts]
blueforce = "blueforce.cli:main"

[tool.setuptools.packages.find]
include = ["blueforce*"]

[tool.setuptools.package-data]
"blueforce.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
